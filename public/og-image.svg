<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Inference — og image 1200x630 (design system light : bg #FAFAF7, accent bleu seul) -->

  <defs>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <mask id="gearMask">
      <rect x="0" y="0" width="1200" height="630" fill="url(#fadeLeft)"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- Décoration engrenages (fils fins, accent bleu, fondu vers le texte) -->
  <g mask="url(#gearMask)">
    <g fill="none" stroke="#2C63C0" stroke-width="2">
      <circle cx="940" cy="315" r="270" opacity="0.30"/>
      <circle cx="940" cy="315" r="205" opacity="0.22"/>
      <circle cx="940" cy="315" r="140" opacity="0.30"/>
      <circle cx="940" cy="315" r="70" opacity="0.35"/>
      <path d="M940 238 v 22 M940 370 v 22 M863 315 h 22 M995 315 h 22" opacity="0.35"/>
      <circle cx="1080" cy="130" r="46" opacity="0.28"/>
      <circle cx="760" cy="545" r="30" opacity="0.22"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="80" y="120" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" letter-spacing="7" fill="#111111">INFERENCE</text>
  <rect x="80" y="152" width="52" height="4" fill="#2C63C0"/>

  <!-- Titre -->
  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#111111">Decode the</text>
  <text x="80" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#2C63C0">Complex.</text>

  <!-- Sous-titre -->
  <text x="82" y="520" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#444444">
    <tspan x="82" dy="0">Conseil &amp; ingénierie logicielle pour organisations</tspan>
    <tspan x="82" dy="40">en évolution numérique — Réponse sous 48h.</tspan>
  </text>

  <!-- Ligne de fond -->
  <line x1="80" y1="585" x2="300" y2="585" stroke="#D8D8D8" stroke-width="1"/>
  <text x="80" y="612" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2" fill="#666666">INFERENCE.BF</text>
</svg>